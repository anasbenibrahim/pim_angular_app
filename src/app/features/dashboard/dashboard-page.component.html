<div class="app-layout" [class.dark-mode]="isDark">
  <!-- Top Navigation Bar -->
  <header class="top-navbar">
    <nav class="nav-links">
      <button type="button" *ngFor="let section of visibleSections" class="nav-item"
        [class.active]="activeSection === section.key" (click)="selectSection(section.key)">
        {{ section.title }}
      </button>
    </nav>
    <div class="nav-right">
      <!-- Mail / Messages -->
      <button type="button" class="icon-btn" (click)="selectSection('clinical-messaging')">
        <i class="ri-mail-line"></i>
      </button>
      
      <!-- Notifications -->
      <div class="notification-wrapper" *ngIf="role === 'admin'">
        <button type="button" class="icon-btn" (click)="toggleNotifications()">
          <i class="ri-notification-3-line"></i>
          <span class="badge" *ngIf="notificationCount > 0"></span>
        </button>
        <!-- Notification Dropdown -->
        <div class="notification-dropdown" *ngIf="showNotifications">
          <div class="dropdown-header">
            <strong>Notifications</strong>
            <button type="button" class="link-btn-sm" (click)="selectSection('volunteers')">Voir demandes</button>
          </div>
          <div class="dropdown-state" *ngIf="notificationsLoading">Chargement...</div>
          <div class="dropdown-state error" *ngIf="!notificationsLoading && notificationsError">{{ notificationsError }}</div>
          <div class="dropdown-state" *ngIf="!notificationsLoading && !notificationsError && notifications.length === 0">
            Aucune notification récente
          </div>
          <div class="dropdown-item" *ngFor="let n of notifications">
            <div class="dropdown-icon" [ngClass]="n.color">
              <i [class]="n.icon"></i>
            </div>
            <div class="dropdown-content">
              <p>{{ n.title }}</p>
              <small>{{ n.time }}</small>
            </div>
          </div>
        </div>
      </div>

      <!-- Profile -->
      <div class="profile-info" (click)="openProfile()" style="cursor: pointer;">
        <div class="avatar">{{ userInitials }}</div>
        <div class="user-details">
          <span class="role-text">{{ role }}</span>
          <span class="name-text">{{ displayName }}</span>
        </div>
      </div>
      
      <!-- Theme & Logout -->
      <button type="button" class="icon-btn small-btn" (click)="toggleTheme()" title="Toggle Theme">
        <i [class]="isDark ? 'ri-sun-line' : 'ri-moon-line'"></i>
      </button>
      <button type="button" class="icon-btn small-btn logout-btn" (click)="logout()" title="Logout">
        <i class="ri-logout-box-r-line"></i>
      </button>
    </div>
  </header>

  <!-- Main Content Area -->
  <div class="global-main-card">
    <main class="main-content" [ngSwitch]="activeSection">
      <ng-container *ngSwitchCase="'dashboard'">
        <app-dashboard-overview *ngIf="role === 'admin'; else doctorDashboard"></app-dashboard-overview>
        <ng-template #doctorDashboard>
          <app-doctor-dashboard></app-doctor-dashboard>
        </ng-template>
      </ng-container>
      <app-doctor-appointments-history *ngSwitchCase="'appointments-history'"></app-doctor-appointments-history>
      <app-doctor-clinical-workspace *ngSwitchCase="'shared-care-plan'"></app-doctor-clinical-workspace>
      <app-doctor-clinical-messaging *ngSwitchCase="'clinical-messaging'"></app-doctor-clinical-messaging>
      <app-users-management *ngSwitchCase="'users'"></app-users-management>
      <app-volunteers-validation *ngSwitchCase="'volunteers'"></app-volunteers-validation>
      <app-doctors-validation *ngSwitchCase="'doctors'"></app-doctors-validation>
      <app-live-map *ngSwitchCase="'map'"></app-live-map>
    </main>
  </div>
</div>
