<section class="profile-shell">
  <article class="profile-card" *ngIf="!isLoading; else loadingTemplate">
    <header class="profile-header">
      <div>
        <h2>Mon profil</h2>
        <p>Mise à jour des informations du compte connecté.</p>
      </div>
      <button type="button" class="ghost-btn" (click)="goBackToDashboard()">
        <i class="ri-arrow-left-line"></i>
        Dashboard
      </button>
    </header>

    <ng-container *ngIf="feedback as fb">
      <div class="feedback" [class.success]="fb.kind === 'success'" [class.error]="fb.kind === 'error'">
        {{ fb.message }}
      </div>
    </ng-container>

    <div class="meta" *ngIf="profile as prof">
      <div>
        <span>Email</span>
        <strong>{{ prof.email }}</strong>
      </div>
      <div>
        <span>Rôle</span>
        <strong>{{ roleLabel() }}</strong>
      </div>
    </div>

    <form [formGroup]="profileForm" class="form-grid" (ngSubmit)="onSubmit()">
      <div class="field">
        <label for="nom">Nom</label>
        <input id="nom" type="text" formControlName="nom" />
      </div>

      <div class="field">
        <label for="prenom">Prénom</label>
        <input id="prenom" type="text" formControlName="prenom" />
      </div>

      <div class="field">
        <label for="age">Âge</label>
        <input id="age" type="number" min="1" max="150" formControlName="age" />
      </div>

      <div class="actions">
        <button type="submit" class="primary-btn" [disabled]="isSaving">
          <i class="ri-save-line"></i>
          {{ isSaving ? 'Mise à jour...' : 'Mettre à jour' }}
        </button>
      </div>
    </form>
  </article>
</section>

<ng-template #loadingTemplate>
  <section class="profile-shell">
    <article class="profile-card">
      <p>Chargement du profil...</p>
    </article>
  </section>
</ng-template>
